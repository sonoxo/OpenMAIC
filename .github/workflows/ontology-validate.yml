name: Ontology validation

on:
  pull_request:
    paths:
      - "ontology/**"
      - "scripts/validate-ontology.mjs"
      - ".github/workflows/ontology-validate.yml"
  push:
    branches:
      - main
    paths:
      - "ontology/**"
      - "scripts/validate-ontology.mjs"
      - ".github/workflows/ontology-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate ontology contract
        run: node scripts/validate-ontology.mjs
